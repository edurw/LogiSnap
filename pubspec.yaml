name: logisnap
description: "Simulador de circuitos lógicos digitais para celular, inspirado no Logisim Evolution."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  xml: ^6.5.0
  path_provider: ^2.1.3
  file_picker: ^12.0.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/examples/
